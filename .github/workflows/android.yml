# The Android app (docs/ANDROID.md): an APK with the game's resources, attached to every published GitHub Release, or
# built by hand (Actions → Android → Run workflow) as a downloadable artifact. Signed with the ANDROID_* secrets when the
# repository has them, else with a debug key (installs, but cannot update a release-signed install).
name: Android

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      server:
        description: 素材来源服务器（它的 /resource-manifest.json）
        required: true
        default: https://stronghold.lunar.ag

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERVER: ${{ inputs.server || 'https://stronghold.lunar.ag' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STRONGHOLD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      STRONGHOLD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      STRONGHOLD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # the runner image carries the Android SDK (ANDROID_HOME); the Android Gradle plugin installs what it lacks
      - name: Resources (the server's resource manifest, ~430 MB)
        run: node tools/build-android.mjs --server="$SERVER"

      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STRONGHOLD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease
          version=$(node -p "require('../package.json').version")
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/app-release.apk "../dist-android/stronghold-protocol-$version.apk"
          ls -la ../dist-android

      - uses: actions/upload-artifact@v5
        with:
          name: stronghold-protocol-apk
          path: dist-android/*.apk
          compression-level: 0
          retention-days: 30

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-android/*.apk --clobber
